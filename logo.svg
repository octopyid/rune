<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Clean Light Slate -->
    <linearGradient id="bg-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Raido Main Accent: Electric Blue to Indigo -->
    <linearGradient id="raido-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Shadow halus untuk kontainer logo -->
    <filter id="soft-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>

    <!-- Shadow untuk code card -->
    <filter id="card-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.05" />
    </filter>
  </defs>

  <!-- Canvas -->
  <rect width="800" height="240" rx="20" fill="url(#bg-light)" />
  <rect width="798" height="238" x="1" y="1" rx="19" fill="none" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- ════════════════════════════════ -->
  <!-- EMBLEM: RUNE RAIDO (ᚱ)         -->
  <!-- ════════════════════════════════ -->
  <g transform="translate(36, 35)">
    <rect x="0" y="0" width="170" height="170" rx="36"
          fill="#ffffff" stroke="#e2e8f0" stroke-width="2"
          filter="url(#soft-shadow)" />

    <!-- macOS traffic lights -->
    <circle cx="30" cy="28" r="4.5" fill="#f87171" />
    <circle cx="44" cy="28" r="4.5" fill="#fbbf24" />
    <circle cx="58" cy="28" r="4.5" fill="#34d399" />

    <!-- Spine -->
    <line x1="62" y1="52" x2="62" y2="138"
          stroke="#0f172a" stroke-width="9" stroke-linecap="round" />
    <!-- Arch -->
    <path d="M 62,56 L 108,82 L 62,108"
          fill="none" stroke="url(#raido-grad)"
          stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Leg -->
    <line x1="84" y1="95" x2="122" y2="138"
          stroke="url(#raido-grad)" stroke-width="9" stroke-linecap="round" />
    <!-- Cursor block -->
    <rect x="128" y="128" width="14" height="6" rx="3" fill="#0284c7" />
    <!-- Node -->
    <circle cx="108" cy="82" r="4.5"
            fill="#ffffff" stroke="#2563eb" stroke-width="3" />
  </g>

  <!-- ════════════════════════════════ -->
  <!-- LOGOTYPE                        -->
  <!-- ════════════════════════════════ -->
  <g transform="translate(240, 0)">
    <!-- Badge: Runefile -->
    <rect x="0" y="54" width="88" height="24" rx="12"
          fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
    <text x="44" y="70"
          font-family="'JetBrains Mono','Fira Code',monospace"
          font-size="11" font-weight="700"
          fill="#2563eb" text-anchor="middle">Runefile</text>

    <!-- Wordmark -->
    <text x="0" y="152"
          font-family="system-ui,-apple-system,'SF Pro Display','Segoe UI',Roboto,sans-serif"
          font-size="80" font-weight="800"
          letter-spacing="2"
          fill="#0f172a">RUNE</text>

    <!-- Subtitle -->
    <text x="4" y="186"
          font-family="'JetBrains Mono','Fira Code','Courier New',monospace"
          font-size="15" font-weight="600"
          letter-spacing="0.5"
          fill="#475569">
      <tspan fill="#2563eb" font-weight="800">$</tspan> tasks as commands
    </text>
  </g>

  <!-- ════════════════════════════════ -->
  <!-- VERTICAL DIVIDER                -->
  <!-- ════════════════════════════════ -->
  <line x1="575" y1="30" x2="575" y2="210"
        stroke="#e2e8f0" stroke-width="1.5" />

  <!-- ════════════════════════════════ -->
  <!-- RIGHT: RUNEFILE SNIPPET         -->
  <!-- Light card, matching theme      -->
  <!-- ════════════════════════════════ -->
  <g transform="translate(592, 35)">
    <rect width="172" height="170" rx="16"
          fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"
          filter="url(#card-shadow)" />

    <!-- Card header bar -->
    <rect width="172" height="34" rx="16" fill="#f1f5f9" />
    <rect y="18" width="172" height="16" fill="#f1f5f9" />
    <!-- Header dots -->
    <circle cx="20" cy="17" r="4" fill="#e2e8f0" />
    <circle cx="34" cy="17" r="4" fill="#e2e8f0" />
    <circle cx="48" cy="17" r="4" fill="#e2e8f0" />
    <!-- File label -->
    <text x="86" y="22"
          font-family="'JetBrains Mono','Fira Code',monospace"
          font-size="9.5" fill="#94a3b8" text-anchor="middle">Runefile</text>

    <!-- Line 1: comment -->
    <text x="14" y="52"
          font-family="'JetBrains Mono','Fira Code',monospace"
          font-size="9.5" fill="#94a3b8">#[Build the binary]</text>

    <!-- Line 2: task signature -->
    <text x="14" y="68"
          font-family="'JetBrains Mono','Fira Code',monospace"
          font-size="9.5" fill="#2563eb" font-weight="700">build</text>
    <text x="51" y="68"
          font-family="'JetBrains Mono','Fira Code',monospace"
          font-size="9.5" fill="#64748b">--race?:</text>

    <!-- Line 3: body -->
    <text x="24" y="83"
          font-family="'JetBrains Mono','Fira Code',monospace"
          font-size="9.5" fill="#059669">go build</text>
    <text x="74" y="83"
          font-family="'JetBrains Mono','Fira Code',monospace"
          font-size="9.5" fill="#475569">{{race}}</text>

    <!-- Separator -->
    <line x1="14" y1="95" x2="158" y2="95" stroke="#e2e8f0" stroke-width="1" />

    <!-- Line 4: comment -->
    <text x="14" y="111"
          font-family="'JetBrains Mono','Fira Code',monospace"
          font-size="9.5" fill="#94a3b8">#[confirm: Delete DB?]</text>

    <!-- Line 5: task -->
    <text x="14" y="126"
          font-family="'JetBrains Mono','Fira Code',monospace"
          font-size="9.5" fill="#7c3aed" font-weight="700">db:fresh</text>
    <text x="79" y="126"
          font-family="'JetBrains Mono','Fira Code',monospace"
          font-size="9.5" fill="#64748b">:</text>

    <!-- Line 6: body -->
    <text x="24" y="141"
          font-family="'JetBrains Mono','Fira Code',monospace"
          font-size="9.5" fill="#059669">dropdb</text>
    <text x="67" y="141"
          font-family="'JetBrains Mono','Fira Code',monospace"
          font-size="9.5" fill="#475569">app_dev</text>

    <!-- Cursor -->
    <rect x="14" y="153" width="8" height="11" rx="2"
          fill="#2563eb" opacity="0.5" />
  </g>

</svg>
